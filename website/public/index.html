
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oracle SQL Counter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .card {
      width: min(90%, 380px);
      padding: 36px;
      text-align: center;
      background: white;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
    }

    .counter {
      margin: 25px 0;
      padding: 24px;
      border: 1px solid #dbeafe;
      border-radius: 12px;
      background: #eff6ff;
    }

    #count {
      font-size: 52px;
      font-weight: bold;
      color: #2563eb;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      min-height: 20px;
      margin-top: 16px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>SQL Counter</h1>
    <p>Live value from Oracle Database</p>

    <div class="counter">
      <div id="count">Loading...</div>
    </div>

    <button id="increment">+ Increment Count</button>
    <p id="status">Connecting to database...</p>
  </main>

  <script>
    const countElement = document.getElementById("count");
    const button = document.getElementById("increment");
    const statusElement = document.getElementById("status");

    async function loadCount() {
      try {
        const response = await fetch("/api/count");

        if (!response.ok) {
          throw new Error("Database request failed");
        }

        const data = await response.json();
        countElement.textContent = data.count;
        statusElement.textContent = "Connected to Oracle Database";
      } catch (error) {
        statusElement.textContent =
          "Unable to load count. Check the database and server.";
      }
    }

    button.addEventListener("click", async () => {
      button.disabled = true;
      statusElement.textContent = "Updating database...";

      try {
        const response = await fetch("/api/increment", {
          method: "POST"
        });

        if (!response.ok) {
          throw new Error("Update failed");
        }

        const data = await response.json();
        countElement.textContent = data.count;
        statusElement.textContent = "Saved to Oracle Database";
      } catch (error) {
        statusElement.textContent =
          "Update failed. Please check the server.";
      } finally {
        button.disabled = false;
      }
    });

    loadCount();
  </script>
</body>
</html>
